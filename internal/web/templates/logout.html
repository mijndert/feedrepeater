{{define "content"}}
<h1>Sign out?</h1>
<p class="hint">Signed in as {{acct .User.Handle}}. Feeds keep posting while you're signed out.</p>

<form method="post" action="/logout" class="row">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <button type="submit" class="primary">Sign out</button>
  <a class="button" href="/dashboard">Cancel</a>
</form>
{{end}}
