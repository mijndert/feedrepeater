{{define "content"}}
<h1 class="narrow">Post your feeds where you read.</h1>
<p class="services">{{range $i, $k := .Data.Kinds}}{{if $i}} · {{end}}{{$k.Label}}{{end}}</p>
<p class="narrow">RSS and Atom in, new entries out. No ads, no tracking, no JavaScript.</p>

<form method="post" action="/login" class="stack narrow">
  <label for="instance">Mastodon instance</label>
  <input type="text" id="instance" name="instance" placeholder="mastodon.social"
         autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <button type="submit" class="primary">Sign in</button>
</form>

<p class="hint">{{.Data.MaxFeeds}} feeds, {{.Data.MaxDestinations}} destinations. Free during the beta.</p>
{{end}}
