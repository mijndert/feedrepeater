name: image

# Builds the container image and publishes it to GitHub Container Registry.
#
# During the beta the Synology pulls a finished image rather than building on
# the device: Container Manager has no Go toolchain, and a NAS CPU compiling a
# module graph is a slow way to find out a commit was broken. Every push to
# main lands a fresh :latest for the NAS to pull.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Pull requests build but do not publish. The point is to find a broken
  # Dockerfile before main has an image nothing can run.
  pull_request:
  workflow_dispatch:

# Only the newest image on a branch is ever pulled, so a superseded run is
# wasted minutes.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The Go build cross-compiles natively, but the final stage runs apk and
      # adduser in the target architecture, so arm64 needs emulation for that
      # one small layer.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions. No personal access token to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest is what Container Manager follows. The sha tag is what to
          # pin to when a beta build misbehaves and the previous one has to come
          # back — :latest has already moved by then.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Synology ships both Intel and ARM models, and the difference is
          # invisible until a container exits with "exec format error".
          # Building the pair means the image runs on either.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations add unknown/unknown entries to the manifest list that
          # DSM's older Docker has been known to trip over. Nothing here needs
          # them yet; turn them on when the beta ends and the NAS is not the
          # thing pulling.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
